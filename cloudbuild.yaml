steps:
  # 1. Build container image using multi-stage Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/retailiq:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/retailiq:latest', '.']

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/retailiq:$COMMIT_SHA']

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'retailiq'
      - '--image'
      - 'gcr.io/$PROJECT_ID/retailiq:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/retailiq:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/retailiq:latest'
